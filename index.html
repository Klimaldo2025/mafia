<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏆 Турнир «Спортивная мафия»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span>🎭🏆</span> Спортивная мафия — Турнир</h1>
  <a class="btn" href="admin.html">🔑 Вход для ведущего</a>
</header>
<div class="wrap">
  <div id="st"></div>
  <div class="card">
    <div class="hint">🔗 Ссылка содержит результаты на момент её создания.
    Спросите у ведущего свежую ссылку после новых игр.
    Ведущий получает её в панели управления → кнопка «📋 Скопировать ссылку для игроков».</div>
  </div>
</div>
<script src="app.js"></script>
<script>
let data = freshData();
const fromLink = location.hash.startsWith('#d=');
let broken = false;
if(fromLink){
  try{ data = decodeData(location.hash.slice(3)); }
  catch(e){ broken = true; }
} else {
  try{ const s = localStorage.getItem('mafia_data'); if(s) data = JSON.parse(s); }catch(e){}
}
document.getElementById('st').innerHTML = broken
  ? '<div class="card"><div class="msg">⚠️ Ссылка повреждена — попросите у ведущего новую</div></div>'
  : renderStandings(data);
</script>
</body>
</html>
